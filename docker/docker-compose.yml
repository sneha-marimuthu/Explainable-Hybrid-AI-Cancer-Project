version: '3.8'

services:
  cancer-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../outputs:/app/outputs
      - ../data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/api/app.py
