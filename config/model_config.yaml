model:
  model_name: resnet50
  input_size: 224
  num_classes: 3
  pretrained: true
  dropout_rate: 0.3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  scheduler: step
  early_stopping_patience: 10
  validation_split: 0.2
  data_augmentation: true

xai:
  grad_cam_layer: layer4.2
  shap_samples: 100
  lime_samples: 1000
  attention_visualization: true
  output_heatmaps: true
